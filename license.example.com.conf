# Nginx 反向代理配置示例
# 将此文件复制到 /etc/nginx/sites-available/ 并修改域名和 IP

server {
    listen 80;
    server_name license.example.com;  # 修改为你的域名

    # 日志配置
    access_log /var/log/nginx/license-server-access.log;
    error_log /var/log/nginx/license-server-error.log;

    # 客户端请求体大小限制
    client_max_body_size 10M;

    # IP 访问限制 - 仅允许指定 IP 访问（可选）
    # allow 192.168.1.0/24;
    # allow 10.0.0.0/8;
    # deny all;

    # 反向代理到 license-server
    location / {
        proxy_pass http://license-server:2712;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 健康检查端点
    location /health {
        proxy_pass http://license-server:2712/health;
        proxy_set_header Host $host;
        access_log off;
    }
}

